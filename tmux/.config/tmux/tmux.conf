# Minimal tmux config (vi copy-mode, sane defaults, optional plugins).

set -g mouse on
set -g history-limit 100000

setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1

# Statusline (Catppuccin Mocha-ish + powerline separators; requires Nerd Font).
set -g status on
set -g status-interval 5
set -g status-justify left

# Palette (truecolor).
# Base: #1e1e2e, Surface0: #313244, Text: #cdd6f4
# Mauve: #cba6f7, Blue: #89b4fa, Peach: #fab387, Green: #a6e3a1
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#fab387"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g status-left-length 100
set -g status-right-length 150

set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e]"

# Windows list.
setw -g window-status-format " #[fg=#cdd6f4,bg=#1e1e2e]#I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[fg=#89b4fa,bg=#1e1e2e]"

# Right side: prefix indicator + clock + host.
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] #{?client_prefix,PREFIX ,}#[fg=#fab387,bg=#313244]#[fg=#1e1e2e,bg=#fab387] %Y-%m-%d %H:%M #[fg=#a6e3a1,bg=#fab387]#[fg=#1e1e2e,bg=#a6e3a1] #H "

# Pane navigation (vim-style).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Also allow pane navigation without prefix (Alt-h/j/k/l).
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Popup: prefix + P opens a centered popup shell in the current pane's path.
# Note: requires tmux >= 3.2 (display-popup).
bind P display-popup -E -d '#{pane_current_path}' -w 85% -h 85% zsh
bind p previous-window

# Persistent scratch window: prefix + S toggles a "scratch" window (created on first use).
bind S if-shell -F '#{==:#{window_name},scratch}' \
  'last-window' \
  'run-shell -b "sh ~/.config/tmux/scratch-toggle.sh"'

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# WSL clipboard: prefer clip.exe, fallback to xclip.
if-shell 'command -v clip.exe >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# TPM + plugins (safe if TPM isn't installed yet).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
